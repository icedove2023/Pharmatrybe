plugin_id: "who_knowledge"
plugin_name: "WHO Knowledge Base"
plugin_version: "0.1.0"
plugin_type: "knowledge"
deployment_type: "artifact"
description: "WHO respiratory infection clinical guidelines and antimicrobial stewardship evidence"
author: "WHO / PharmaTrybe Team"
organization: "WHO"
entrypoint_module: "app.plugins.knowledge.who_knowledge_plugin"
entrypoint_class: "WHOKnowledgePlugin"
capabilities:
  - "disease_guidelines"
  - "antibiotic_classification"
  - "antimicrobial_stewardship"
  - "diagnostic_guidance"
  - "treatment_recommendations"
  - "monitoring_guidance"
  - "follow_up_guidance"
  - "evidence_retrieval"
dependencies:
  - "python3.9+"
  - "sqlalchemy"
  - "postgresql"
supported_domains:
  - "respiratory"
  - "gastrointestinal"
  - "urinary_tract"
  - "wound"
  - "bloodstream"
  - "meningitis"
  - "general"
configuration_schema: {}
minimum_platform_version: "0.1.0"
sdk_version: "0.1.0"
