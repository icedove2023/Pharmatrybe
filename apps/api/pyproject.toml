[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmatrybe-api"
version = "0.1.0"
description = "PharmaTrybe FastAPI backend bootstrap"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.0",
  "cryptography>=42.0.0",
  "SQLAlchemy>=2.0.0",
  "psycopg2-binary>=2.9.0",
  "PyJWT[crypto]>=2.8.0",
  "httpx>=0.27.0",
  "supabase>=2.0.0",
  "python-multipart>=0.0.9",
]
